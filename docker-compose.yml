services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vinylstore
      POSTGRES_USER: vinylstore
      POSTGRES_PASSWORD: vinylstore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinylstore -d vinylstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vinylstore
      POSTGRES_USER: vinylstore
      POSTGRES_PASSWORD: vinylstore
      PAYMENT_SERVICE_URL: http://payment-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "9090:9090"

volumes:
  postgres-data:
